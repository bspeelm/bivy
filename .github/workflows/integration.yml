# The tests that need a real mpv and the live network.
#
# Never on a pull request. These depend on a third party that has, in this
# project's own history, refused every request for hours while the rest of its
# site answered normally — that outage is what ADR-013 exists for. A gate that
# goes red for reasons the diff cannot cause is a gate people learn to ignore,
# so this runs on its own and blocks nothing. A failure here is information
# about the outside world, which is exactly what it is for.
#
# `make check` stays the gate, and it requires none of this installed.
name: integration

on:
  schedule:
    # Daily. Often enough to notice the extractor or the feed format moving,
    # rarely enough that a flaky third party is not a daily alarm.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: mpv and the extractor
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv
          # Not from the distribution: the extractor is the part of this stack
          # that rots fastest, and a packaged one is old by the time it lands.
          sudo curl -fsSL -o /usr/local/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          mpv --version | head -1
          yt-dlp --version

      - name: mpv and the extractor
        if: runner.os == 'macOS'
        run: |
          brew install mpv yt-dlp
          mpv --version | head -1
          yt-dlp --version

      # No display here, and bivy only asks for a window once something plays,
      # so the socket, the flags and the process hygiene are all covered
      # without one. The test that plays a video skips unless it is told what
      # to play, and nothing here tells it.
      - run: make integration

      # The extractor is not exercised here, and cannot be: this address gets
      # "Sign in to confirm you're not a bot", whose only offered remedy is
      # cookies, which is the thing ADR-004 exists to refuse. So playback and
      # stream resolution are verified by hand on a workstation, and the
      # review packet for each release says so rather than implying CI covered
      # it (ADR-015).
      #
      # What runs above still covers the feeds, the socket, the flag set and
      # the process hygiene, on both platforms.
